name: Monitor FX rates and deploy dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 8,12,16,20 * * *"
      timezone: "Asia/Shanghai"

concurrency:
  group: fx-monitor-pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Run tests
        run: |
          python -m unittest discover -s tests -v
          npm test
      - name: Fetch rates and evaluate alerts
        env:
          SEND_EMAIL: ${{ github.event_name != 'push' && secrets.SMTP_HOST != '' && secrets.SMTP_USER != '' && secrets.SMTP_PASSWORD != '' && secrets.MAIL_TO != '' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python scripts/monitor.py
      - name: Persist latest rates and alert state
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add public/data/rates.json state/alerts.json
          git diff --cached --quiet || git commit -m "chore: refresh exchange rates"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: monitor
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
